site_name: Sundew
site_description: "Kernel ipset access control for nginx, without giving your web server root"
repo_url: https://github.com/jan-krueger/sundew
edit_uri: ""
strict: true

validation:
  anchors: warn

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - toc.integrate
    - navigation.indexes
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Security model: security.md
  - Monitoring: monitoring.md
  - Troubleshooting: troubleshooting.md
  - Internals:
      - How it works: internals/how-it-works.md
      - Compatibility: internals/compatibility.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc: { permalink: true }

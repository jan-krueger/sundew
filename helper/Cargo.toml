[package]
name = "sundew-helper"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-2-Clause"
description = "Privileged helper for the Sundew nginx module: the only process holding CAP_NET_ADMIN"
publish = false

[features]
test-delay = []

[dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 2

[profile.dev]
panic = "abort"

name: targets

# Builds targets the latest release has no tarballs for, from that release's
# tag, and adds them to it: a new nginx needs no new Sundew release.

on:
  push:
    branches: [main]
    paths: ["release/targets.json"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: targets
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sundew

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      targets: ${{ steps.plan.outputs.targets }}
      images: ${{ steps.plan.outputs.images }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release view --json tagName -q .tagName)
          missing=$(python3 .github/scripts/targets.py missing "$tag")
          images=$(echo "$missing" | python3 -c 'import json,sys; print(json.dumps([t for t in json.load(sys.stdin) if t.get("image")]))')
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "targets=$missing"
            echo "images=$images"
            echo "latest=$(python3 .github/scripts/targets.py latest-image)"
          } >> "$GITHUB_OUTPUT"
          echo "$tag lacks: $(echo "$missing" | python3 -c 'import json,sys; print(", ".join(t["name"] for t in json.load(sys.stdin)) or "nothing")')"

  build:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.plan.outputs.tag }}
      version: ${{ needs.plan.outputs.version }}
      targets: ${{ needs.plan.outputs.targets }}
      images: ${{ needs.plan.outputs.images }}

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.tar.gz
      - name: Add to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          cd out
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --output SHA256SUMS.old
          sha256sum -- *.tar.gz > new.sums
          cat SHA256SUMS.old new.sums | sort -k2 -u > SHA256SUMS
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- *.tar.gz SHA256SUMS
      - name: Latest image tags
        if: needs.plan.outputs.images != '[]'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.plan.outputs.version }}
          LATEST: ${{ needs.plan.outputs.latest }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          if docker buildx imagetools inspect "$IMAGE:$VERSION-$LATEST" >/dev/null 2>&1; then
              docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:$VERSION-$LATEST"
              docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION-$LATEST"
          fi

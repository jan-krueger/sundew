name: targets

# A change to release/targets.json on main cuts a patch release of the latest
# release for the targets it lacks: the release's code, the new target list and
# checksums, a version bump and a CHANGELOG entry. Releases stay immutable.

on:
  push:
    branches: [main]
    paths: ["release/targets.json"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: targets
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
      base: ${{ steps.cut.outputs.base }}
      summary: ${{ steps.cut.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: cut
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(gh release view --json tagName -q .tagName)
          missing=$(python3 .github/scripts/targets.py missing "$base")
          if [ "$missing" = "[]" ]; then
              echo "$base has every target"
              exit 0
          fi
          summary=$(echo "$missing" | python3 .github/scripts/targets.py summary)
          next=$(python3 .github/scripts/targets.py next-patch "$base")
          echo "$next: $base plus $summary"

          tools="$RUNNER_TEMP/main"
          mkdir -p "$tools"
          cp .github/scripts/targets.py release/targets.json versions.mk "$tools/"
          git switch -q --detach "$base"
          cp "$tools/targets.json" release/targets.json
          cp "$tools/versions.mk" versions.mk
          python3 "$tools/targets.py" bump "${next#v}" "${base#v}" "$summary"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "chore: release ${next#v}"
          git tag "$next"
          git push origin "refs/tags/$next"
          {
            echo "tag=$next"
            echo "base=${base#v}"
            echo "summary=$summary"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: cut
    if: needs.cut.outputs.tag != ''
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.cut.outputs.tag }}

  changelog:
    needs: [cut, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Record the release on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.cut.outputs.tag }}
          BASE: ${{ needs.cut.outputs.base }}
          SUMMARY: ${{ needs.cut.outputs.summary }}
        run: |
          version=${TAG#v}
          python3 .github/scripts/targets.py changelog "$version" "$BASE" "$SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "docs: changelog for $version"
          if ! git push origin HEAD:main; then
              branch="bot/changelog-$version"
              git push -f origin "HEAD:refs/heads/$branch"
              gh pr create --head "$branch" --title "docs: changelog for $version" \
                  --body "Records $TAG, which added prebuilt modules for $SUMMARY."
          fi

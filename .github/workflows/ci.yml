name: ci

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs the full suite before publishing.
  workflow_call:
    inputs:
      ref:
        description: commit to test; the caller's by default
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.plan.outputs.test }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: plan
        run: |
          {
            echo "test=$(python3 .github/scripts/targets.py matrix ci)"
            echo "images=$(python3 .github/scripts/targets.py matrix image-test)"
          } >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: make lint
      - run: make unit
      - run: make docs-build

  test:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.test) }}
    name: test (nginx ${{ matrix.cell.nginx }}${{ matrix.cell.san && ', sanitizers' || '' }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Load the ip_set kernel modules
        run: ./.github/load-ipset.sh
      - env:
          NGINX: ${{ matrix.cell.nginx }}
          SAN: ${{ matrix.cell.san }}
        run: make test-all NGINX_VERSION="$NGINX" SAN="$SAN"
      - if: matrix.cell.san == ''
        env:
          NGINX: ${{ matrix.cell.nginx }}
        run: make test-pid1 NGINX_VERSION="$NGINX"

  image:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Load the ip_set kernel modules
        run: ./.github/load-ipset.sh
      - env:
          BASE: ${{ matrix.target.base }}
          NGINX: ${{ matrix.target.nginx }}
        run: make test-image BASE="$BASE" NGINX_VERSION="$NGINX" RELEASE_IMAGE=sundew-test

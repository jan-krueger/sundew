<figure class="sw-figure">
<svg class="sw-diagram" viewBox="0 0 1000 220" role="img" aria-label="On reload a new helper checks every set. If one is missing or of the wrong type, the reload is rejected and the old configuration keeps running. Otherwise new workers use the new helper and the old helper serves old workers until they exit.">
<defs>
<pattern id="rl-grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" class="grid-dot"/></pattern>
<marker id="rl-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
<marker id="rl-ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head hot"/></marker>
</defs>
<rect width="1000" height="220" fill="url(#rl-grid)"/>
<rect x="20" y="82" width="170" height="56" rx="8" class="box"/>
<text x="105" y="106" text-anchor="middle" class="title">reload</text>
<text x="105" y="124" text-anchor="middle" class="sub">HUP, nginx -s reload</text>
<line x1="190" y1="110" x2="248" y2="110" class="edge" marker-end="url(#rl-ah)"/>
<rect x="250" y="82" width="220" height="56" rx="8" class="box"/>
<text x="360" y="106" text-anchor="middle" class="title">new helper starts</text>
<text x="360" y="124" text-anchor="middle" class="sub">checks every set</text>
<path d="M470,100 H500 V48 H598" class="edge hot" marker-end="url(#rl-ah-hot)"/>
<path d="M470,120 H500 V172 H598" class="edge" marker-end="url(#rl-ah)"/>
<text x="508" y="38" class="hot-label">set missing</text>
<text x="508" y="196" class="sub">all fine</text>
<rect x="600" y="20" width="380" height="56" rx="8" class="box"/>
<text x="790" y="44" text-anchor="middle" class="title">reload rejected</text>
<text x="790" y="62" text-anchor="middle" class="sub">old configuration keeps running</text>
<rect x="600" y="144" width="380" height="56" rx="8" class="box"/>
<text x="790" y="168" text-anchor="middle" class="title">new workers use the new helper</text>
<text x="790" y="186" text-anchor="middle" class="sub">old helper serves old workers until they exit</text>
</svg>
<figcaption>A configuration that names a missing set never goes live; there is no moment in which requests fail because of it.</figcaption>
</figure>

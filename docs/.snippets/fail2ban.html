<figure class="sw-figure">
<svg class="sw-diagram" viewBox="0 0 1000 140" role="img" aria-label="fail2ban reads the nginx access log and adds offenders to the ipset f2b-web with a timeout; Sundew looks addresses up in that set and denies them.">
<defs>
<pattern id="f2b-grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" class="grid-dot"/></pattern>
<marker id="f2b-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
<marker id="f2b-ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head hot"/></marker>
</defs>
<rect width="1000" height="140" fill="url(#f2b-grid)"/>
<rect x="20" y="40" width="170" height="56" rx="8" class="box"/>
<text x="105" y="64" text-anchor="middle" class="title">access log</text>
<text x="105" y="82" text-anchor="middle" class="sub">nginx</text>
<line x1="190" y1="68" x2="248" y2="68" class="edge" marker-end="url(#f2b-ah)"/>
<text x="219" y="60" text-anchor="middle" class="sub">reads</text>
<rect x="250" y="40" width="150" height="56" rx="8" class="box"/>
<text x="325" y="64" text-anchor="middle" class="title">fail2ban</text>
<text x="325" y="82" text-anchor="middle" class="sub">finds offenders</text>
<line x1="400" y1="68" x2="508" y2="68" class="edge" marker-end="url(#f2b-ah)"/>
<text x="454" y="60" text-anchor="middle" class="sub">ipset add</text>
<rect x="495" y="20" width="200" height="96" rx="12" class="zone z-kernel"/>
<rect x="510" y="40" width="170" height="56" rx="8" class="box"/>
<text x="595" y="64" text-anchor="middle" class="title">f2b-web</text>
<text x="595" y="82" text-anchor="middle" class="sub">kernel ipset, timeout</text>
<line x1="752" y1="68" x2="682" y2="68" class="edge hot" marker-end="url(#f2b-ah-hot)"/>
<text x="717" y="60" text-anchor="middle" class="hot-label">lookup</text>
<rect x="754" y="40" width="120" height="56" rx="8" class="box"/>
<text x="814" y="64" text-anchor="middle" class="title">Sundew</text>
<text x="814" y="82" text-anchor="middle" class="sub">in nginx</text>
<line x1="874" y1="68" x2="908" y2="68" class="edge" marker-end="url(#f2b-ah)"/>
<rect x="910" y="40" width="70" height="56" rx="8" class="box"/>
<text x="945" y="73" text-anchor="middle" class="title">403</text>
</svg>
<figcaption>fail2ban writes the set, Sundew reads it. Neither needs to know about the other.</figcaption>
</figure>

<figure class="sw-figure">
<svg class="sw-diagram" viewBox="0 0 1000 150" role="img" aria-label="A client connects through a CDN, which adds X-Forwarded-For. nginx's realip module replaces the connection address with the client address before Sundew checks it.">
<defs>
<pattern id="px-grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" class="grid-dot"/></pattern>
<marker id="px-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
<marker id="px-ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head hot"/></marker>
</defs>
<rect width="1000" height="150" fill="url(#px-grid)"/>
<rect x="20" y="40" width="170" height="56" rx="8" class="box"/>
<text x="105" y="64" text-anchor="middle" class="title">client</text>
<text x="105" y="82" text-anchor="middle" class="sub">198.51.100.7</text>
<line x1="190" y1="68" x2="268" y2="68" class="edge" marker-end="url(#px-ah)"/>
<rect x="270" y="40" width="170" height="56" rx="8" class="box"/>
<text x="355" y="64" text-anchor="middle" class="title">CDN</text>
<text x="355" y="82" text-anchor="middle" class="sub">203.0.113.10</text>
<line x1="440" y1="68" x2="588" y2="68" class="edge" marker-end="url(#px-ah)"/>
<text x="514" y="58" text-anchor="middle" class="sub">X-Forwarded-For:</text>
<text x="514" y="90" text-anchor="middle" class="sub">198.51.100.7</text>
<rect x="570" y="20" width="410" height="110" rx="12" class="zone z-workers"/>
<text x="584" y="122" class="zl zl-workers">nginx</text>
<rect x="590" y="40" width="160" height="56" rx="8" class="box"/>
<text x="670" y="64" text-anchor="middle" class="title">realip</text>
<text x="670" y="82" text-anchor="middle" class="sub">trusts the CDN</text>
<line x1="750" y1="68" x2="818" y2="68" class="edge hot" marker-end="url(#px-ah-hot)"/>
<text x="784" y="58" text-anchor="middle" class="hot-label">client =</text>
<text x="784" y="90" text-anchor="middle" class="hot-label">198.51.100.7</text>
<rect x="820" y="40" width="140" height="56" rx="8" class="box"/>
<text x="890" y="64" text-anchor="middle" class="title">Sundew</text>
<text x="890" y="82" text-anchor="middle" class="sub">checks the client</text>
</svg>
<figcaption>The connection comes from the CDN. realip replaces it with the address the CDN reports, and that is the address Sundew checks.</figcaption>
</figure>

<rect x="200" y="140" width="300" height="300" rx="12" class="zone z-workers"/>

<figcaption>Workers, which parse untrusted traffic, hold no capabilities. They send the helper only an address and set numbers; the helper, the only process with <code>CAP_NET_ADMIN</code>, asks the kernel. Tools that maintain the sets talk to the kernel directly.</figcaption>
</figure>
